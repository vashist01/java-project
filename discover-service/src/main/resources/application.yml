server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false   # Eureka server should not register itself
    fetch-registry: false         # It should not fetch registry from anywhere
    service-url:
      defaultZone: http://localhost:8761/eureka/

  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: true #If renewals drop below that → self-preservation mode activates
    eviction-interval-timer-in-ms: 10000
    renewal-percent-threshold: 0.49 #Eureka expects 49% heartbeat renewals


logging:
  level:
    com.netflix.discovery: INFO
    org.springframework.cloud.netflix.eureka: DEBUG
