spring:
  kafka:
    producer:
      acks: all
      retries: 3
      compression-type: snappy
      batch-size: 32768
      linger-ms: 5
      transaction-id-prefix: payment-tx-   # ✅ REQUIRED

    properties:
      enable.idempotence: true             # ✅ FIXED KEY
      max.in.flight.requests.per.connection: 5